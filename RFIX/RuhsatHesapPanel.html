<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruhsat Hesap</title>
<style>
:root{--ink:#171b1c;--green:#18a05e;--green2:#137a4a;--soft:#eaf7f0;--bg:#f3f6f5;--card:#fff;--line:#d8dedb;--muted:#66716b;--danger:#c83c3c;--warn:#c87816;--shadow:0 8px 24px rgba(23,27,28,.08)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;font:13px/1.45 "Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}
body{display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:64px minmax(0,1fr) 34px;overflow:hidden;transition:grid-template-columns .2s}
body.nav-collapsed{grid-template-columns:66px minmax(0,1fr)}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);z-index:5}
.logo{width:40px;height:40px;flex:0 0 40px}.brand{min-width:150px}.brand strong{display:block;font-size:15px;letter-spacing:.1em}.brand span{color:var(--muted);font-size:11px}.project-title{min-width:0;flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.native-badge{display:flex;align-items:center;gap:6px;color:var(--green2);font-size:11px;font-weight:700}.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}.native-badge.off{color:var(--warn)}.native-badge.off .dot{background:var(--warn)}
.top-actions{display:flex;gap:6px;align-items:center}.btn{border:1px solid #cbd4cf;background:#fff;border-radius:7px;padding:8px 11px;color:var(--ink);font-weight:650;white-space:nowrap}.btn:hover{border-color:var(--green);color:var(--green2)}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{color:var(--danger)}.btn.small{padding:5px 8px;font-size:11px}.icon-btn{width:36px;height:36px;padding:0;display:grid;place-items:center}
.sidebar{grid-row:2/4;background:var(--ink);color:#fff;overflow:hidden;display:flex;flex-direction:column}.nav-head{display:flex;align-items:center;justify-content:space-between;padding:11px 12px 7px}.nav-head span{font-size:10px;letter-spacing:.16em;color:#aeb8b3}.nav-toggle{border:0;background:#2b3132;color:#fff;border-radius:6px;width:32px;height:32px;font-size:17px}
.nav{padding:4px 8px 12px;overflow-y:auto}.nav button{width:100%;display:flex;align-items:center;gap:11px;border:0;background:transparent;color:#d9dfdc;border-radius:7px;padding:9px 10px;text-align:left;margin:2px 0}.nav button:hover,.nav button.active{background:#293230;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--green)}.nav i{font-style:normal;width:22px;text-align:center;font-size:16px}.nav span{white-space:nowrap}
.nav-collapsed .nav-head span,.nav-collapsed .nav span{display:none}.nav-collapsed .nav button{justify-content:center;padding:10px 5px}.nav-collapsed .nav i{width:auto}
.main{grid-column:2;grid-row:2;overflow:auto;padding:18px}.view{display:none;max-width:1440px;margin:0 auto}.view.active{display:block}.view-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:14px}.view-head h1{font-size:21px;margin:0 0 3px}.view-head p{margin:0;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px;margin-bottom:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}.stat{padding:15px}.stat small{color:var(--muted);font-weight:650}.stat strong{display:block;font-size:22px;margin-top:6px}.stat .ok{color:var(--green2)}.stat .bad{color:var(--danger)}
.panel{padding:15px;margin-bottom:14px}.panel-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:-15px -15px 14px;padding:11px 15px;border-bottom:1px solid var(--line)}.panel-title h2{font-size:14px;margin:0}.panel-title .meta{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px}.field label{display:block;color:var(--muted);font-size:11px;font-weight:650;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd4cf;border-radius:6px;background:#fff;padding:8px 9px;color:var(--ink)}.field textarea{min-height:80px;resize:vertical}.field input:focus,.field select:focus{outline:2px solid rgba(24,160,94,.16);border-color:var(--green)}.field .readonly{background:#eef2f0;color:#4c5852}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:8px;border-bottom:1px solid var(--line);border-right:1px solid #e8ecea;text-align:right;vertical-align:middle}.table th{position:sticky;top:0;background:#eef3f0;font-size:11px;color:#4c5852;z-index:1}.table th:first-child,.table td:first-child{text-align:left}.table tr:last-child td{border-bottom:0}.table input,.table select{width:100%;min-width:76px;border:1px solid transparent;background:transparent;padding:5px;text-align:right;border-radius:4px}.table input:focus,.table select:focus{border-color:var(--green);background:#fff;outline:0}.table .total{font-weight:800;background:var(--soft)}.table .linked{color:var(--green2);font-size:10px;font-weight:700}
.block{margin-bottom:14px}.block-head{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#202728;color:#fff;border-radius:8px 8px 0 0}.block-head strong{flex:1}.block-head .btn{background:#fff}
.notice{padding:12px 13px;border-radius:8px;background:#eef2f0;color:#3f4a45;border-left:4px solid #83908a;margin-bottom:13px}.notice.ok{background:#e8f6ee;border-color:var(--green);color:var(--green2)}.notice.bad{background:#fff0ef;border-color:var(--danger);color:#8d2929}.notice.warn{background:#fff6e8;border-color:var(--warn);color:#8a5616}
.status{grid-column:2;grid-row:3;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 14px;color:#4d5953;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.save-state{margin-left:auto;font-weight:700;color:var(--green2)}
.empty{padding:28px;text-align:center;color:var(--muted)}.pill{display:inline-flex;padding:3px 7px;border-radius:99px;background:var(--soft);color:var(--green2);font-size:10px;font-weight:750}.row-actions{display:flex;gap:5px;justify-content:flex-end}.section-actions{display:flex;gap:6px;flex-wrap:wrap}.formula{font-family:Consolas,monospace;background:#f0f3f1;border-radius:5px;padding:2px 5px}.right{text-align:right}
.text-dialog{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(8,15,13,.54);z-index:1000}.text-dialog.open{display:flex}.text-dialog-card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 55px rgba(0,0,0,.28);padding:18px}.text-dialog-card h2{margin:0 0 5px;font-size:17px}.text-dialog-card p{margin:0 0 14px;color:var(--muted);font-size:12px}.text-dialog-card input{width:100%;border:1px solid #aebbb5;border-radius:7px;padding:10px 11px;font-size:14px;color:var(--ink);background:#fff}.text-dialog-card input:focus{outline:3px solid rgba(24,160,94,.18);border-color:var(--green)}.text-dialog-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:16px}
.zone-dialog{z-index:990}.zone-dialog-card{width:min(580px,100%);max-height:88vh;overflow:auto}.zone-form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.zone-form .field{display:flex;flex-direction:column;gap:4px}.zone-form .field.wide{grid-column:1/-1}.zone-form label{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}.zone-form input,.zone-form select{width:100%;border:1px solid #aebbb5;border-radius:7px;padding:8px 10px;font-size:13px;color:var(--ink);background:#fff}.zone-form input:focus,.zone-form select:focus{outline:3px solid rgba(24,160,94,.18);border-color:var(--green)}.zone-form input.readonly{background:var(--soft);color:var(--muted);font-weight:700;letter-spacing:.06em}.zone-form .zone-check{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink);background:var(--soft);border-radius:7px;padding:8px 10px}.zone-form .zone-check input{width:auto;flex:none}.zone-preview{margin-top:14px;background:#0f1513;border-radius:8px;padding:11px 12px;overflow-x:auto}.zone-preview code{display:block;color:#7ee2ab;font:600 12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}.zone-warning{margin-top:9px;font-size:12px;line-height:1.45;color:var(--danger);min-height:17px}.zone-warning.hint{color:var(--muted)}
@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.top-actions .wide{display:none}}
@media(max-width:700px){body{grid-template-columns:66px minmax(0,1fr)}.nav-head span,.nav span{display:none}.nav button{justify-content:center;padding:10px 5px}.nav i{width:auto}.brand span,.native-badge{display:none}.main{padding:10px}.cards,.grid{grid-template-columns:1fr}.top{padding:7px}.project-title{display:none}}
</style>
</head>
<body>
<header class="top">
  <svg class="logo" viewBox="0 0 64 64" aria-label="Ruhsat Hesap"><path fill="#171B1C" d="M12 10 31 1.5 46 8.5V22l-7 3.5V13l-8-4-9 4.5v15l6 3V18l6 3v14.5L30 38l-18-9V10Z"/><path fill="#18A05E" d="m12 31.5 18 9 16-8v4l-16 8-18-9v-4Z"/><path fill="#171B1C" d="m12 38 18 9 16-8v7l-16 8-18-9v-7Zm0 10 18 9 16-8v6l-16 8-18-9v-6Z"/></svg>
  <div class="brand"><strong>RUHSAT HESAP</strong><span>Archicad 29 entegre hesap paneli</span></div>
  <div class="project-title" id="projectTitle">Adsız proje</div>
  <div class="native-badge off" id="nativeBadge"><span class="dot"></span><span>Bağlantı bekleniyor</span></div>
  <div class="top-actions">
    <button class="btn wide" data-native="ReadStories">Katları Oku</button>

    <button class="btn wide" data-native="ReadZones">Zonları Aktar</button>
    <button class="btn primary" data-native="SaveToPln">PLN Kaydet</button>
    <button class="btn" data-native="ExportReports">Excel + Pafta</button>
    <button class="btn icon-btn" id="moreButton" title="JSON işlemleri">⋮</button>

</header>
<aside class="sidebar">
  <div class="nav-head"><span>HESAP MODÜLLERİ</span><button class="nav-toggle" id="navToggle" title="Menüyü aç/kapat">☰</button></div>
  <nav class="nav" id="nav">
    <button class="active" data-view="dashboard"><i>⌂</i><span>Genel Bakış</span></button>
    <button data-view="parcel"><i>▱</i><span>Parsel / TAKS-KAKS</span></button>
    <button data-view="emsal"><i>Σ</i><span>Emsal Hesabı</span></button>
    <button data-view="units"><i>▦</i><span>Bağımsız Bölümler</span></button>
    <button data-view="condominium"><i>≡</i><span>Kat İrtifakı</span></button>
    <button data-view="construction"><i>▤</i><span>Yapı İnşaat Alanı</span></button>
    <button data-view="area"><i>㎡</i><span>İnşaat Alanı Hesabı</span></button>
    <button data-view="retaining"><i>▰</i><span>İstinat / Kotlar</span></button>
    <button data-view="shelter"><i>⌑</i><span>Sığınak Hesabı</span></button>
    <button data-view="parking"><i>Ⓟ</i><span>Otopark Hesabı</span></button>
    <button data-view="excavation"><i>◒</i><span>Kazı–Dolgu</span></button>
  </nav>
</aside>
<main class="main" id="main">
  <section class="view active" id="view-dashboard"></section>
  <section class="view" id="view-parcel"></section>
  <section class="view" id="view-emsal"></section>
  <section class="view" id="view-units"></section>
  <section class="view" id="view-condominium"></section>
  <section class="view" id="view-construction"></section>
  <section class="view" id="view-area"></section>
  <section class="view" id="view-retaining"></section>
  <section class="view" id="view-shelter"></section>
  <section class="view" id="view-parking"></section>
  <section class="view" id="view-excavation"></section>
</main>
<div class="text-dialog" id="textDialog" aria-hidden="true">
  <div class="text-dialog-card" role="dialog" aria-modal="true" aria-labelledby="textDialogTitle">
    <h2 id="textDialogTitle">Yeni alan</h2>
    <p id="textDialogLabel">Alan adını yazın.</p>
    <input id="textDialogInput" type="text" autocomplete="off" spellcheck="false">
    <div class="text-dialog-actions">
      <button class="btn" type="button" id="textDialogCancel">İptal</button>
      <button class="btn primary" type="button" id="textDialogConfirm">Ekle</button>
    </div>
  </div>
</div>
<div class="text-dialog zone-dialog" id="zoneDialog" aria-hidden="true">
  <div class="text-dialog-card zone-dialog-card" role="dialog" aria-modal="true" aria-labelledby="zoneDialogTitle">
    <h2 id="zoneDialogTitle">Zon Kodu Oluştur</h2>
    <p id="zoneDialogHint">Alanları doldurun; kod aşağıda oluşur ve Archicad'de seçili zonların adına yazılır.</p>
    <div class="zone-form" id="zoneForm"></div>
    <div class="zone-preview"><code id="zoneDialogPreview">RH</code></div>
    <div class="zone-warning" id="zoneDialogWarning"></div>
    <div class="text-dialog-actions">
      <button class="btn" type="button" id="zoneDialogCancel">Kapat</button>
      <button class="btn" type="button" id="zoneDialogCopy">Kodu Kopyala</button>
      <button class="btn primary" type="button" id="zoneDialogApply">Seçili Zonlara Yaz</button>
    </div>
  </div>
</div>
<footer class="status"><span class="dot"></span><span id="statusText">Panel hazırlanıyor…</span><span class="save-state" id="saveState"></span></footer>
<script>
(function(){
"use strict";
var state=null,native=false,saveTimer=0,activeView="dashboard",textDialogCallback=null;
var defaults={format:"ruhsat-hesap-archicad",schemaVersion:5,parcel:{projectName:"",city:"",district:"",neighborhood:"",block:"",parcel:"",parcelArea:0,taksRate:0,kaksRate:0,directEmsal:0,buildingFootprint:0,emsalMethod:"kaks"},archicadStories:[],blocks:[],retainingWalls:[],providedParkingSpaces:0,auxiliaryData:{}};
function clone(v){return JSON.parse(JSON.stringify(v));}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];});}
function num(v){v=String(v==null?"":v).replace(/\s/g,"");if(v.indexOf(",")>=0){v=v.replace(/\./g,"").replace(",",".");}v=parseFloat(v);return isFinite(v)?v:0;}
function fmt(v){return num(v).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2});}
function naturalUnitCompare(left,right){var a=String(left&&left.number!=null?left.number:"").trim(),b=String(right&&right.number!=null?right.number:"").trim();if(!a||!b)return a?-1:b?1:0;var ap=a.match(/\d+|\D+/g)||[],bp=b.match(/\d+|\D+/g)||[],zeroTie=0,count=Math.min(ap.length,bp.length);for(var i=0;i<count;i++){var ad=/^\d+$/.test(ap[i]),bd=/^\d+$/.test(bp[i]);if(ad&&bd){var av=ap[i].replace(/^0+/,"")||"0",bv=bp[i].replace(/^0+/,"")||"0";if(av.length!==bv.length)return av.length-bv.length;if(av!==bv)return av<bv?-1:1;if(!zeroTie&&ap[i].length!==bp[i].length)zeroTie=ap[i].length-bp[i].length;}else{if(ad!==bd)return ad?-1:1;var textResult=ap[i].localeCompare(bp[i],"tr-TR",{sensitivity:"base"});if(textResult)return textResult;}}if(ap.length!==bp.length)return ap.length-bp.length;return zeroTie||a.localeCompare(b,"tr-TR");}
function sortUnits(project){if(!project||!Array.isArray(project.blocks))return project;project.blocks.forEach(function(block){if(Array.isArray(block.units))block.units.sort(naturalUnitCompare);});return project;}
function normalize(p){p=p&&typeof p==="object"?p:clone(defaults);Object.keys(defaults).forEach(function(k){if(p[k]==null)p[k]=clone(defaults[k]);});Object.keys(defaults.parcel).forEach(function(k){if(p.parcel[k]==null)p.parcel[k]=defaults.parcel[k];});if(!Array.isArray(p.blocks))p.blocks=[];if(!Array.isArray(p.archicadStories))p.archicadStories=[];if(!Array.isArray(p.retainingWalls))p.retainingWalls=[];if(!p.auxiliaryData||typeof p.auxiliaryData!=="object")p.auxiliaryData={};var a=p.auxiliaryData;if(!Array.isArray(a.thirtyPercentKeys))a.thirtyPercentKeys=["merdiven","acik_cikma","sacak","havuz","asansor","kat_holu","giris_terasi"];if(!Array.isArray(a.constructionKeys))a.constructionKeys=["merdiven","asansor","bosluklar","siginak","sacak","makina_odasi","enerji_odasi","hol","su_deposu","haberlesme_odasi"];if(a.commonArea==null)a.commonArea=0;if(!a.condominium)a.condominium={};if(!a.shelter)a.shelter={useType:"residential",nonResidentialEmsal:0,officialEmsal:0,bedCount:0,careBedCount:0,stadiumCapacity:0,industrialEmsal:0,industrialWorkers:0,providedArea:0};p.blocks.forEach(function(b,i){if(!b.name)b.name=String.fromCharCode(65+i);if(!Array.isArray(b.floors))b.floors=[];if(!Array.isArray(b.units))b.units=[];b.floors.forEach(function(f){if(!f.thirtyPercentAreas)f.thirtyPercentAreas={};if(!f.constructionAreas)f.constructionAreas={};if(f.emsalArea==null)f.emsalArea=0;if(f.emsalOutsideArea==null)f.emsalOutsideArea=0;});});return sortUnits(p);}
function openTextDialog(title,label,initialValue,confirmText,callback){var dialog=document.getElementById("textDialog"),input=document.getElementById("textDialogInput");document.getElementById("textDialogTitle").textContent=title;document.getElementById("textDialogLabel").textContent=label;document.getElementById("textDialogConfirm").textContent=confirmText||"Ekle";input.value=initialValue||"";textDialogCallback=callback;dialog.classList.add("open");dialog.setAttribute("aria-hidden","false");setTimeout(function(){input.focus();input.select();},30);}
function closeTextDialog(accepted){var dialog=document.getElementById("textDialog"),input=document.getElementById("textDialogInput"),callback=textDialogCallback,value=accepted?input.value:null;textDialogCallback=null;dialog.classList.remove("open");dialog.setAttribute("aria-hidden","true");if(callback)callback(value);}
function normalizeAreaKey(value){return String(value||"").trim().toLocaleLowerCase("tr-TR").replace(/\s+/g,"_");}
function zoneTipCode(value){return String(value||"").trim().toLocaleUpperCase("tr-TR").replace(/İ/g,"I").replace(/Ş/g,"S").replace(/Ğ/g,"G").replace(/Ü/g,"U").replace(/Ö/g,"O").replace(/Ç/g,"C").replace(/[^A-Z0-9]+/g,"_").replace(/^_+|_+$/g,"");}
function sumMap(m){return Object.keys(m||{}).reduce(function(t,k){return t+num(m[k]);},0);}
function calc(){var p=state.parcel,maxFoot=num(p.parcelArea)*num(p.taksRate),maxE=p.emsalMethod==="direct"?num(p.directEmsal):num(p.parcelArea)*num(p.kaksRate),emsal=0,construct=0,retaining=0,units=0,rawPark=0,total30=0,outside=0;state.blocks.forEach(function(b){b.floors.forEach(function(f){emsal+=num(f.emsalArea);outside+=num(f.emsalOutsideArea);total30+=sumMap(f.thirtyPercentAreas);construct+=sumMap(f.constructionAreas);b.units.forEach(function(u){if(u.floor===f.name)construct+=num(u.grossArea);});});b.units.forEach(function(u){var g=num(u.grossArea);units++;if(g>0)rawPark+=g<80?1/3:g<120?1/2:g<180?1:2;});});state.retainingWalls.forEach(function(w){retaining+=num(w.area);});return{maxFootprint:maxFoot,maxEmsal:maxE,calculatedEmsal:emsal,emsalExcess:Math.max(0,emsal-maxE),constructionArea:construct,retainingWallArea:retaining,constructionGrandTotal:construct+retaining,requiredTrees:num(p.parcelArea)>0?Math.ceil(Math.max(0,num(p.parcelArea)-num(p.buildingFootprint))/30):0,requiredParkingSpaces:Math.ceil(rawPark),unitCount:units,total30:total30,emsalOutside:outside};}
function pathGet(path){return path.split(".").reduce(function(o,k){return o==null?undefined:o[k];},state);}
function pathSet(path,value){var keys=path.split("."),o=state;keys.slice(0,-1).forEach(function(k){if(o[k]==null)o[k]={};o=o[k];});o[keys[keys.length-1]]=value;}
function status(msg){document.getElementById("statusText").textContent=msg||"";}
function receive(raw){var data=typeof raw==="string"?JSON.parse(raw):raw;if(data.project)state=normalize(data.project);if(data.message)status(data.message);render();return data;}
function nativeCall(name,arg){if(native&&window.RuhsatNative&&typeof window.RuhsatNative[name]==="function"){document.getElementById("saveState").textContent="İşleniyor…";return window.RuhsatNative[name](arg).then(function(raw){document.getElementById("saveState").textContent="";if(name==="SaveProjectData"){var data=typeof raw==="string"?JSON.parse(raw):raw;if(data.message)status(data.message);return data;}return receive(raw);}).catch(function(e){document.getElementById("saveState").textContent="Hata";status(String(e));});}return Promise.resolve({ok:false});}
// Like nativeCall but returns the raw parsed reply instead of treating it as a
// project snapshot -- used by bridge calls that answer a question (GetSelectedZones).
function nativeQuery(name,arg){if(!(native&&window.RuhsatNative&&typeof window.RuhsatNative[name]==="function"))return Promise.resolve(null);return window.RuhsatNative[name](arg).then(function(raw){try{return typeof raw==="string"?JSON.parse(raw):raw;}catch(e){return null;}},function(){return null;});}

function parseZoneName(name){var parts=String(name==null?"":name).split("|");if(!parts.length||zoneTipCode(parts[0])!=="RH")return null;var out={};parts.slice(1).forEach(function(token){var i=token.indexOf("=");if(i<0)i=token.indexOf(":");if(i<0)return;var key=zoneTipCode(token.slice(0,i)),value=String(token.slice(i+1)).trim();if(key==="BLOK"||key==="B")out.block=value;else if(key==="BB"||key==="BAGIMSIZBOLUM")out.unit=value;else if(key==="TIP"||key==="T")out.tip=value;else if(key==="ODA"||key==="O")out.rooms=value;else if(key==="MAHAL"||key==="M")out.mahal=value;else if(key==="NITELIK"||key==="N")out.nitelik=value;else if(key==="HESAP"||key==="H")out.hesap=value;});return out;}
