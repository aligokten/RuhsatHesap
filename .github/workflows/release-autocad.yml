name: Release AutoCAD Plugin

# `autocad-v*` etiketi gönderildiğinde eklentiyi derler, kurulmaya hazır
# RuhsatHesap.bundle paketini zipler ve kalıcı indirme bağlantısı veren bir
# GitHub Release yayımlar.

on:
  push:
    tags:
      - 'autocad-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x

      - name: Restore
        run: dotnet restore AutoCAD/RuhsatHesap.AutoCAD.sln

      - name: Run core tests
        run: dotnet test AutoCAD/tests/RuhsatHesap.Core.Tests/RuhsatHesap.Core.Tests.csproj -c Release --no-restore

      - name: Build plug-in
        run: dotnet build AutoCAD/src/RuhsatHesap.Acad/RuhsatHesap.Acad.csproj -c Release --no-restore

      - name: Package bundle
        id: package
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notlike 'autocad-v*') { $tag = 'autocad-dev' }
          $version = $tag -replace '^autocad-v', ''

          # Zip'in kökünde RuhsatHesap.bundle klasörü durur; kullanıcı klasörü
          # doğrudan ApplicationPlugins içine kopyalar.
          $bundle = "artifacts/RuhsatHesap.bundle"
          New-Item -ItemType Directory -Force -Path "$bundle/Contents/net48" | Out-Null
          New-Item -ItemType Directory -Force -Path "$bundle/Contents/net8.0-windows" | Out-Null
          Copy-Item AutoCAD/bundle/PackageContents.xml "$bundle/PackageContents.xml"
          Copy-Item AutoCAD/src/RuhsatHesap.Acad/bin/Release/net48/RuhsatHesap.*.dll "$bundle/Contents/net48/"
          Copy-Item AutoCAD/src/RuhsatHesap.Acad/bin/Release/net8.0-windows/RuhsatHesap.*.dll "$bundle/Contents/net8.0-windows/"
          Copy-Item AutoCAD/README.md "$bundle/OKUBENI.md"
          Copy-Item AutoCAD/ETIKET-STANDARDI.md "$bundle/ETIKET-STANDARDI.md"

          $zip = "RuhsatHesap-AutoCAD-$version.zip"
          Compress-Archive -Path $bundle -DestinationPath $zip -Force
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT
          Get-Item $zip | Select-Object Name, Length

      - name: Write release notes
        shell: pwsh
        run: |
          @'
          Ruhsat Hesap programının AutoCAD sürümü. Kapalı polylineların alanını
          okur; polyline seçimli alan hesap tablosu, emsal, yapı inşaat alanı,
          bağımsız bölüm ve kat irtifakı tablolarını çizime yerleştirir, Excel ve
          JSON olarak dışa aktarır.

          ## Kurulum

          1. Aşağıdaki zip dosyasını indirin.
          2. İçindeki `RuhsatHesap.bundle` klasörünü şuraya kopyalayın:
             `%APPDATA%\Autodesk\ApplicationPlugins\`
          3. Kopyaladığınız klasördeki `.dll` dosyalarının engelini kaldırın
             (internetten inen dosyaları Windows işaretler, AutoCAD işaretli
             assembly yüklemez).
          4. AutoCAD''i yeniden başlatın, komut satırına `RHYARDIM` yazın.

          PowerShell ile tek seferde:

          ```powershell
          $zip  = "$env:USERPROFILE\Downloads\RuhsatHesap-AutoCAD-VERSION.zip"
          $dest = "$env:APPDATA\Autodesk\ApplicationPlugins"
          Expand-Archive $zip -DestinationPath $dest -Force
          Get-ChildItem "$dest\RuhsatHesap.bundle" -Recurse -Filter *.dll | Unblock-File
          ```

          Tek seferlik denemek için `NETLOAD` ile
          `Contents\net48\RuhsatHesap.Acad.dll` (AutoCAD 2019-2024) veya
          `Contents\net8.0-windows\RuhsatHesap.Acad.dll` (AutoCAD 2025+)
          dosyasını da yükleyebilirsiniz.

          ## İlk hesap

          `RHBIRIM` (çizim birimi) -> `RHKAT` (aktif kat) -> `RHETIKET`
          (polylineları etiketle) -> `RHTARA` (çizimi tara) -> `RHTABLOLAR`.
          Parsel ve TAKS/KAKS bilgileri için `RHPARSEL`.

          Ayrıntılar: `OKUBENI.md` ve `ETIKET-STANDARDI.md`.

          ## Notlar

          - Çizim birimi (`RHBIRIM`) yanlışsa alanlar 10.000 kat şaşar;
            varsayılan santimetredir.
          - Blok referansı (`INSERT`) içindeki polylineler taranmaz.
          - Bu bir geliştirme sürümüdür (0.6.0) ve gerçek bir AutoCAD oturumunda
            saha testinden geçmemiştir; çekirdek hesaplar birim testleriyle,
            derleme CI ile doğrulanmıştır.
          '@ -replace 'VERSION', '${{ steps.package.outputs.version }}' |
            Set-Content -Path release-notes.md -Encoding utf8

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.package.outputs.tag }}' '${{ steps.package.outputs.zip }}' `
            --title 'Ruhsat Hesap AutoCAD Eklentisi ${{ steps.package.outputs.version }}' `
            --notes-file release-notes.md `
            --prerelease
          gh release view '${{ steps.package.outputs.tag }}' --json url --jq .url
