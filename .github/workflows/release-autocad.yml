name: Release AutoCAD Plugin

# `autocad-v*` etiketi gönderildiğinde (ya da elle çalıştırıldığında) eklentiyi
# derler, tek dosyalık kurulum programını ve RuhsatHesap.bundle zip'ini üretir,
# kalıcı indirme bağlantısı veren bir GitHub Release yayımlar. Elle
# çalıştırmada sürüm PackageContents.xml'den okunur.

on:
  push:
    tags:
      - 'autocad-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x

      - name: Restore
        run: dotnet restore AutoCAD/RuhsatHesap.AutoCAD.sln

      - name: Run core tests
        run: dotnet test AutoCAD/tests/RuhsatHesap.Core.Tests/RuhsatHesap.Core.Tests.csproj -c Release --no-restore

      - name: Build plug-in
        run: dotnet build AutoCAD/src/RuhsatHesap.Acad/RuhsatHesap.Acad.csproj -c Release --no-restore

      - name: Package bundle
        id: package
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -like 'autocad-v*') {
            $version = $tag -replace '^autocad-v', ''
          } else {
            $version = ([xml](Get-Content AutoCAD/bundle/PackageContents.xml -Raw)).ApplicationPackage.AppVersion
            $tag = "autocad-v$version"
          }

          # Zip'in kökünde RuhsatHesap.bundle klasörü durur; kullanıcı klasörü
          # doğrudan ApplicationPlugins içine kopyalar.
          $bundle = "artifacts/RuhsatHesap.bundle"
          New-Item -ItemType Directory -Force -Path "$bundle/Contents/net48" | Out-Null
          New-Item -ItemType Directory -Force -Path "$bundle/Contents/net8.0-windows" | Out-Null
          Copy-Item AutoCAD/bundle/PackageContents.xml "$bundle/PackageContents.xml"
          Copy-Item AutoCAD/src/RuhsatHesap.Acad/bin/Release/net48/RuhsatHesap.*.dll "$bundle/Contents/net48/"
          Copy-Item AutoCAD/src/RuhsatHesap.Acad/bin/Release/net8.0-windows/RuhsatHesap.*.dll "$bundle/Contents/net8.0-windows/"
          Copy-Item AutoCAD/README.md "$bundle/OKUBENI.md"
          Copy-Item AutoCAD/ETIKET-STANDARDI.md "$bundle/ETIKET-STANDARDI.md"

          $zip = "RuhsatHesap-AutoCAD-$version.zip"
          Compress-Archive -Path $bundle -DestinationPath $zip -Force

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup kurulamadı" }
          }
          & $iscc "/DAppVersion=$version" "/DBundleDir=$PWD\artifacts\RuhsatHesap.bundle" "/DOutputDir=$PWD" "AutoCAD\installer\RuhsatHesap.iss"
          if ($LASTEXITCODE -ne 0) { throw "Kurulum dosyası derlenemedi" }
          $setup = "RuhsatHesap-AutoCAD-Kurulum-$version.exe"

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "setup=$setup" >> $env:GITHUB_OUTPUT
          Get-Item $zip, $setup | Select-Object Name, Length

      - name: Write release notes
        shell: pwsh
        run: |
          @'
          Ruhsat Hesap programının AutoCAD sürümü. Kapalı polylineların alanını
          okur; polyline seçimli alan hesap tablosu, emsal, yapı inşaat alanı,
          bağımsız bölüm ve kat irtifakı tablolarını çizime yerleştirir, Excel ve
          JSON olarak dışa aktarır.

          ## Kurulum

          `RuhsatHesap-AutoCAD-Kurulum-VERSION.exe` dosyasını indirip çalıştırın.
          AutoCAD kapalı olmalıdır; yönetici yetkisi gerekmez. Kurulumdan sonra
          AutoCAD'i açtığınızda üst şeritte **Ruhsat Hesap** sekmesi görünür.

          Windows SmartScreen "bilinmeyen yayıncı" uyarısı verirse (kurulum
          dosyası kod imzalı değildir) *Ek bilgi > Yine de çalıştır* deyin.

          ### Elle kurulum (zip)

          1. `RuhsatHesap-AutoCAD-VERSION.zip` dosyasını indirin.
          2. İçindeki `RuhsatHesap.bundle` klasörünü şuraya kopyalayın:
             `%APPDATA%\Autodesk\ApplicationPlugins\`
          3. Klasördeki `.dll` dosyalarının engelini kaldırın, AutoCAD'i
             yeniden başlatın.

          ```powershell
          $zip  = "$env:USERPROFILE\Downloads\RuhsatHesap-AutoCAD-VERSION.zip"
          $dest = "$env:APPDATA\Autodesk\ApplicationPlugins"
          Expand-Archive $zip -DestinationPath $dest -Force
          Get-ChildItem "$dest\RuhsatHesap.bundle" -Recurse -Filter *.dll | Unblock-File
          ```

          ## İlk hesap

          `RHBIRIM` (çizim birimi) -> `RHKAT` (aktif kat) -> `RHETIKET`
          (polylineları etiketle) -> `RHTARA` (çizimi tara) -> `RHTABLOLAR`.
          Parsel ve TAKS/KAKS bilgileri için `RHPARSEL`.

          Ayrıntılar: `OKUBENI.md` ve `ETIKET-STANDARDI.md`.

          ## Notlar

          - Çizim birimi (`RHBIRIM`) yanlışsa alanlar 10.000 kat şaşar;
            varsayılan santimetredir.
          - Blok referansı (`INSERT`) içindeki polylineler taranmaz.
          - Su deposu hesaplarındaki katsayılar varsayılan kabullerdir; idarenizin
            şartlarına göre RHPANEL > Depolar sekmesinden değiştirin.
          - Çekirdek hesaplar birim testleriyle, derleme CI ile doğrulanır.
          '@ -replace 'VERSION', '${{ steps.package.outputs.version }}' |
            Set-Content -Path release-notes.md -Encoding utf8

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.package.outputs.tag }}'
          $files = @('${{ steps.package.outputs.setup }}', '${{ steps.package.outputs.zip }}')
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # Aynı sürüm yeniden yayımlanıyor: dosyaları ve notları yenile.
            gh release upload $tag @files --clobber
            gh release edit $tag --notes-file release-notes.md
          } else {
            gh release create $tag @files `
              --target '${{ github.sha }}' `
              --title 'Ruhsat Hesap AutoCAD Eklentisi ${{ steps.package.outputs.version }}' `
              --notes-file release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw "Release yayımlanamadı" }
          gh release view '${{ steps.package.outputs.tag }}' --json url --jq .url
