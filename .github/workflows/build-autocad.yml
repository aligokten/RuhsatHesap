name: Build AutoCAD Plugin

# Ruhsat Hesap AutoCAD eklentisini derler, çekirdek testleri çalıştırır ve
# doğrudan kurulabilir bir RuhsatHesap.bundle paketi üretir.

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
    paths:
      - 'AutoCAD/**'
      - '.github/workflows/build-autocad.yml'
  pull_request:
    paths:
      - 'AutoCAD/**'
      - '.github/workflows/build-autocad.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x

      - name: Restore
        run: dotnet restore AutoCAD/RuhsatHesap.AutoCAD.sln

      - name: Run core tests
        run: dotnet test AutoCAD/tests/RuhsatHesap.Core.Tests/RuhsatHesap.Core.Tests.csproj -c Release --no-restore

      - name: Build plug-in
        run: dotnet build AutoCAD/src/RuhsatHesap.Acad/RuhsatHesap.Acad.csproj -c Release --no-restore

      - name: Package bundle
        shell: pwsh
        run: |
          $bundle = "artifacts/RuhsatHesap.bundle"
          New-Item -ItemType Directory -Force -Path "$bundle/Contents/net48" | Out-Null
          New-Item -ItemType Directory -Force -Path "$bundle/Contents/net8.0-windows" | Out-Null
          Copy-Item AutoCAD/bundle/PackageContents.xml "$bundle/PackageContents.xml"
          Copy-Item AutoCAD/src/RuhsatHesap.Acad/bin/Release/net48/RuhsatHesap.*.dll "$bundle/Contents/net48/"
          Copy-Item AutoCAD/src/RuhsatHesap.Acad/bin/Release/net8.0-windows/RuhsatHesap.*.dll "$bundle/Contents/net8.0-windows/"
          Copy-Item AutoCAD/README.md "$bundle/OKUBENI.md"
          Copy-Item AutoCAD/ETIKET-STANDARDI.md "$bundle/ETIKET-STANDARDI.md"
          Get-ChildItem -Recurse $bundle | Select-Object FullName

      # Tek dosyalık kurulum: bundle'ı kullanıcının ApplicationPlugins
      # klasörüne yerleştirir, AutoCAD açıksa kapatılmasını bekler.
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup kurulamadı" }
          }
          $version = ([xml](Get-Content AutoCAD/bundle/PackageContents.xml -Raw)).ApplicationPackage.AppVersion
          & $iscc "/DAppVersion=$version" "/DBundleDir=$PWD\artifacts\RuhsatHesap.bundle" "/DOutputDir=$PWD\artifacts\installer" "AutoCAD\installer\RuhsatHesap.iss"
          if ($LASTEXITCODE -ne 0) { throw "Kurulum dosyası derlenemedi" }
          Get-ChildItem artifacts/installer | Select-Object Name, Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RuhsatHesap-AutoCAD-Kurulum
          path: artifacts/installer/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: RuhsatHesap-AutoCAD-bundle
          path: artifacts/RuhsatHesap.bundle/**
          if-no-files-found: error
          retention-days: 90
